name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Test on the newest available iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)[\"devices\"]; print(next(x[\"udid\"] for k in sorted(d, reverse=True) if \"iOS\" in k for x in d[k] if x[\"name\"].startswith(\"iPhone\")))")
          set -o pipefail
          xcodebuild test -scheme FormFlow -destination "id=$udid" -skipPackagePluginValidation | tail -n 60
